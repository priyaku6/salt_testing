devices:
  c8kv-7:
    alias: 'uut'
    os: 'iosxe'
    type: 'c8kv'
    platform: 'c8kv'
    connections:
      defaults:
        class: 'unicon.Unicon'

      ssh_login:
        protocol: ssh
        ip: 10.104.187.171

      telnet:
        protocol: telnet
        ip: 10.104.187.212
        port: 2016

      ssh_tacacs:
        protocol: ssh
        ip: 10.104.187.171
        credentials:
          default:
            username: tac_user
            password: Cisco123
          enable:
            password: lab
  
    credentials:
      default:
        username: lab
        password: lab
      enable:
        password: lab
    custom:
      # TLS TACACS+ servers
      tacacs_tls1_name: "TLS_SERVER_REACHABLE"
      tacacs_tls1_ip: "10.76.239.74"
      tacacs_tls2_name: "TLS_SERVER_UNREACHABLE"
      tacacs_tls2_ip: "10.76.1.1"
      tls_group: "TLS_GROUP"
      tls_port: 6049
      tls_idle_timeout: 61
      tls_conn_timeout: 32
      tls_retries: 2
      tls_client_trustpoint: "TP-self-signed-1265144559"
      tls_server_trustpoint: "TACACS_TLS_74"
      address_family: "ipv4"

      # Non-TLS TACACS+ servers
      tacacs_nontls1_name: "NonTLS_Server1"
      tacacs_nontls1_ip: "10.76.239.47"
      tacacs_nontls2_name: "NonTLS_Server2"
      tacacs_nontls2_ip: "10.76.2.2"
      nontls_group: "NonTLS_Group"
      nontls_port: 49

      # Shared settings
      tacacs_key: "cisco"
      source_interface: "GigabitEthernet1"
      tacacs_timeout: 10