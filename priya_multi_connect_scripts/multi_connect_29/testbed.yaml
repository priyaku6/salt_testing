testbed:
    name: tls_login_test
devices:
    vwlc-ksukulka:
        alias: 'uut'
        os: 'iosxe'
        type: 'vwlc'
        platform: 'vwlc'
        connections:
            defaults:
                class: 'unicon.Unicon'
            a:
                protocol: telnet
                ip: 10.76.239.45
                port: 3006
        credentials:
            default:
                username: ksukulka
                password: cisco
            enable:
                password: cisco123
        custom:
            tacacs_key: cisco123
            nontls_server1: "NonTLS_Server1"
            nontls_server1_ip: "192.168.2.1"
            nontls_server2: "NonTLS_Server2"
            nontls_server2_ip: "192.168.2.2"
            tls_group: "TLS_Group"
            nontls_group: "NonTLS_Group"
            tls_client_trustpoint: "TP-self-signed-2215044181"
            tls_server_trustpoint: "ISE_TACACS_TLS_TP"
